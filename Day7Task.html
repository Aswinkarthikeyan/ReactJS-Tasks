<script>
    // TASK 1
    const calculate =(a,b,cb)=>{
        let result =  a+b
        cb(result)
    }

    calculate(10,20,(result)=>{
        console.log("Calling Back,",result)
    })


    // TASK 2
    const checkNumber = (number)=>{
        return new Promise((resolve, reject)=>{
            if(number>10){
                resolve("Valid Number")
            }
            else{
                reject("Invalid Number")
            }
        })
    }
    checkNumber(20).then((result)=>{
        console.log(result)
    }).catch((error)=>{
        console.error(error)
    })


    // TASK 3
    const verifyNumber = async () => {
    try {
    const result = await checkNumber(20);
    console.log(result);
    } catch (error) {
    console.error(error);
    }
    };
    verifyNumber();

</script>
